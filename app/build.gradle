plugins { id 'com.android.application' }

android {
    namespace 'de.notfall.familie'
    compileSdk 35
    defaultConfig {
        applicationId 'de.notfall.familie'
        minSdk 29
        targetSdk 34
        versionCode 16
        versionName '3.2.0'
    }
    // Fester Schlüssel: alle Versionen haben dieselbe Signatur, Updates behalten die Daten.
    // Liegt app/signing/notfall-debug.keystore vor, wird damit signiert (nicht im Repository, siehe docs/INSTALLATION.md).
    def fixedKey = file('signing/notfall-debug.keystore')
    signingConfigs {
        debug {
            if (fixedKey.exists()) {
                storeFile fixedKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
